<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f2f40">
<title>Hotel Duinzicht – Kusthotel Tycoon</title>
<style>
:root{--sea:#1d6f8a;--navy:#0f2f40;--sand:#f6eddc;--sand2:#efe2c8;--coral:#e76f51;--green:#2a9d8f;--amber:#e9a23b;--ink:#1d2a33;--mut:#6b7a85;--card:#fffdf8;--line:#eadfca;--gold:#f2b705}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--sand);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:78px}
header{position:sticky;top:0;z-index:5;background:linear-gradient(160deg,var(--navy),var(--sea));color:#fff;padding:9px 12px 8px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.r1,.r2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:800;font-size:16px;display:flex;align-items:center;gap:7px}
.lvl{background:var(--gold);color:#3b2a00;border-radius:12px;padding:1px 8px;font-size:12px;font-weight:800;position:relative;overflow:hidden}
.xpbar{height:3px;background:rgba(255,255,255,.25);border-radius:2px;margin-top:2px;width:64px}
.xpbar i{display:block;height:100%;background:var(--gold);border-radius:2px}
#cash{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
#cash.neg{color:#ffb4a2}
.r2{margin-top:6px;font-size:13px}
.info{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
#clock{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.15);padding:2px 7px;border-radius:6px}
.speed{display:flex;gap:4px}
.speed button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:7px;padding:5px 8px;font-size:13px;min-width:34px}
.speed button.on{background:#fff;color:var(--navy);font-weight:700}
main{padding:10px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border-radius:14px;padding:11px 12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(60,40,10,.08);border:1px solid var(--line)}
.card h3{margin:0 0 7px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.card h3 small{font-weight:500;color:var(--mut);font-size:12px}
.cvwrap{background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:10px;box-shadow:0 1px 3px rgba(60,40,10,.08)}
canvas{display:block;touch-action:manipulation}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{display:inline-block;font-size:12px;padding:3px 8px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:600}
.chip.g{background:#d4efe9;color:#1d6b5f;border-color:#bfe3da}.chip.r{background:#fbd9cf;color:#a5391e;border-color:#f3c1b3}.chip.b{background:#d6e8f0;color:#164e63;border-color:#c3dbe6}.chip.a{background:#fbe6c2;color:#8a5a06;border-color:#f1d49e}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;gap:8px}
.kv span:first-child{color:var(--mut)}
.kv b{font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:1px;height:46px;border-bottom:1px solid #ccc;position:relative;margin-top:6px}
.bars i{flex:1;background:var(--sea);border-radius:2px 2px 0 0;min-height:1px}
.bars i.hi{background:var(--coral)}
.bars .cap{position:absolute;left:0;right:0;top:0;border-top:1px dashed var(--coral)}
.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-top:2px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;border:0;background:none;padding:7px 1px 8px;font-size:10.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button b{font-size:19px;line-height:1.1}
nav button.on{color:var(--sea);font-weight:700}
nav .dot{position:absolute;top:4px;right:22%;width:9px;height:9px;border-radius:50%;background:var(--coral);display:none}
.list{font-size:13px}
.li{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f0e8d8;gap:6px}
.li .nm{font-weight:600}
.li .sub{color:var(--mut);font-size:12px}
.stp{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0e8d8;gap:8px}
.stp .lab{font-size:14px}
.stp .lab small{display:block;color:var(--mut);font-size:11.5px;margin-top:1px}
.ctl{display:flex;align-items:center;gap:6px}
.ctl button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--sand);font-size:18px;font-weight:700;color:var(--navy)}
.ctl b{min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.tog{width:50px;height:28px;border-radius:14px;background:#ccc;border:0;position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--green)}.tog.on::after{left:25px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;background:var(--sea);color:#fff}
.btn.sec{background:var(--sand2);color:var(--ink)}
.btn.red{background:var(--coral)}
.btn.gold{background:var(--gold);color:#3b2a00}
.btn:disabled{opacity:.45}
.upg{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #f0e8d8}
.upg .d{font-size:12px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px}
.kpi{background:var(--sand);border-radius:10px;padding:7px 8px}
.kpi span{display:block;font-size:11px;color:var(--mut)}
.kpi b{font-size:16px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:4px 3px;text-align:right;border-bottom:1px solid #f0e8d8}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600}
.pos{color:#1d7a50}.neg{color:#b5381b}
#modal{position:fixed;inset:0;background:rgba(10,25,35,.55);z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--card);border-radius:16px;max-width:460px;width:100%;max-height:86vh;overflow:auto;padding:16px}
#modal h2{margin:0 0 8px;font-size:18px}
#modal .acts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
#modal p{margin:6px 0;font-size:14px;line-height:1.4}
#modal label{display:flex;gap:8px;align-items:center;font-size:14px;margin:8px 0}
#modal input[type=checkbox]{width:20px;height:20px}
#toasts{position:fixed;top:96px;left:0;right:0;z-index:15;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(15,47,64,.93);color:#fff;padding:8px 12px;border-radius:10px;font-size:13px;max-width:92%;animation:tin .25s}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
.hint{font-size:12px;color:var(--mut);margin:4px 0 0}
.goal{height:8px;background:var(--sand2);border-radius:4px;overflow:hidden;margin:4px 0 8px}
.goal i{display:block;height:100%;background:var(--green)}
.mis{padding:10px 0;border-bottom:1px solid #f0e8d8}
.mis .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mis .rw{font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="r1">
    <div class="brand">🏨 Hotel Duinzicht <div><span class="lvl" id="lvl">Lv 1</span><div class="xpbar"><i id="xp"></i></div></div></div>
    <div id="cash">€0</div>
  </div>
  <div class="r2">
    <div class="info"><span id="date"></span><span id="clock">07:00</span><span id="wx"></span><span id="rating"></span></div>
    <div class="speed"><button data-s="0">⏸</button><button data-s="1">▶</button><button data-s="2">▶▶</button><button data-s="4">⏩</button></div>
  </div>
</header>
<main>
  <section class="tab on" id="t-kaart">
    <div class="cvwrap"><canvas id="cvMap"></canvas></div>
    <div class="card" id="mapInfo"></div>
  </section>
  <section class="tab" id="t-hotel">
    <div class="chips" id="hchips"></div>
    <div class="cvwrap"><canvas id="cvHotel"></canvas></div>
    <p class="hint">Tik op een kamer voor info, op een lege plek om te bouwen, of bovenaan om een verdieping bij te bouwen.</p>
  </section>
  <section class="tab" id="t-dag"></section>
  <section class="tab" id="t-beheer"></section>
  <section class="tab" id="t-mis"></section>
  <section class="tab" id="t-rap"></section>
</main>
</div>
<nav><div class="in">
  <button data-t="kaart" class="on"><b>🗺️</b>Kaart</button>
  <button data-t="hotel"><b>🏨</b>Hotel</button>
  <button data-t="dag"><b>📋</b>Vandaag</button>
  <button data-t="beheer"><b>⚙️</b>Beheer</button>
  <button data-t="mis"><b>🎯</b>Missies<i class="dot" id="misdot"></i></button>
  <button data-t="rap"><b>📊</b>Rapport</button>
</div></nav>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toasts"></div>

<script>
"use strict";
// ================= helpers =================
const $=s=>document.querySelector(s);
const R=Math.random, rnd=(a,b)=>a+R()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(R()*a.length)];
const pickW=(v,w)=>{let x=R(),s=0;for(let i=0;i<v.length;i++){s+=w[i];if(x<s)return v[i]}return v[v.length-1]};
const fmtT=m=>{m=Math.floor(m);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const eur=v=>(v<0?'-':'')+'€'+Math.round(Math.abs(v)).toLocaleString('nl-BE');
const pct=v=>Math.round(v*100)+'%';
const KEY='hotel_duinzicht_v2';

// ================= constants =================
const TYPES=['double','twin','family'];
const RT={double:{n:'Double',k:'D',ref:120,cl:35,cost:6000},twin:{n:'Twin',k:'T',ref:115,cl:35,cost:6000},family:{n:'Familie',k:'F',ref:175,cl:50,cost:9000}};
const DOGCOST=800, SLOTS=11, MAXF=10;
const OCC=[.38,.42,.5,.62,.72,.8,.95,.95,.75,.6,.45,.55];
const PM=[.75,.75,.8,.9,1,1.1,1.3,1.3,1.0,.9,.75,.85];
const MAAND=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const DAG=['zo','ma','di','wo','do','vr','za'];
const NAMES=['Peeters','Janssens','Maes','Jacobs','Mertens','Willems','Claes','Goossens','Wouters','De Smet','Dubois','Lambert','Dupont','Van den Broeck','Hermans','Smit','De Vries','Müller','Schmidt','Martin','Leroy','Vermeulen','Desmet','Coppens','Declercq','Verhoeven','Pauwels','Van Damme','Lemmens','Baert','Bakker','Wagner','Laurent','Renard','Michiels','Thys','Aerts','Cools','Vandenberghe','Devos'];
const WAGE={rec:190,hk:160,bf:150};
const LAUNDRY=9, BFCOST=5.5, COMM=.15, OT_MIN=.55;
const fixedCost=()=>500+30*nRooms();
const BF_OPEN=450, BF_CLOSE=660, CHECKIN=900, CHECKOUT=720, HK_START=540, HK_END=1020, HK_OT_END=1200, SEATS=50;
const LEVELS=[0,600,1800,4000,7500,12000,18000,26000,36000];
const maxFloors=lv=>Math.min(MAXF,[0,3,5,7,9,10][Math.min(lv,5)]);
const floorCost=f=>15000+3000*f;
const UPG=[
 {id:'coffee',n:'☕ Extra koffiemachines',d:'Gasten ontbijten ±20% sneller.',c:4000,max:1,lv:1},
 {id:'beds',n:'🛏️ 5 extra bijzetbedden',d:'Meer gasten kunnen een bed bijboeken.',c:1500,max:8,lv:1},
 {id:'slots',n:'📱 Ontbijt-tijdslots',d:'Gasten kiezen een tijdslot: de drukte in de ontbijtzaal wordt gespreid.',c:6000,max:1,lv:2},
 {id:'mkt',n:'📣 Campagne "Weekendje zee"',d:'+10% vraag naar kamers.',c:5000,max:1,lv:2},
 {id:'kiosk',n:'🖥️ Self check-in kiosk',d:'Check-in duurt de helft minder lang.',c:10000,max:1,lv:3},
 {id:'reno',n:'🎨 Renovatie kamers',d:'Gasten zijn tevredener (+5 per niveau).',c:25000,max:2,lv:3},
];
const FAC={
 parking:{n:'Parking',e:'🅿️',c:12000,lv:1,d:'+8% vraag · gasten betalen €6/nacht',col:'#8d949c',h:4},
 fiets:{n:'Fietsverhuur',e:'🚲',c:5000,lv:1,d:'Inkomsten van fietsende gasten, meer bij zon',col:'#e9a23b',h:14},
 speeltuin:{n:'Speeltuin',e:'🛝',c:8000,lv:2,d:'+15% vraag familiekamers, families tevredener',col:'#7cc36b',h:6},
 weide:{n:'Hondenweide',e:'🐕',c:6000,lv:2,d:'×1,5 hondenboekingen, baasjes tevredener',col:'#9bd17f',h:5},
 terras:{n:'Zonneterras & bar',e:'☀️',c:15000,lv:3,d:'Bar-inkomsten bij mooi weer (vooral zomer)',col:'#e76f51',h:12},
 well:{n:'Wellness & sauna',e:'🧖',c:40000,lv:4,d:'+5 tevredenheid, +5% vraag, inkomsten',col:'#6aa9c9',h:22},
 strandbar:{n:'Strandbar',e:'🍹',c:30000,lv:4,d:'Veel inkomsten in de zomer',col:'#f4a261',h:14,beach:true},
};
// isometrische kaart: 8x8. j=7 zee, j=6 strand, j=5 dijk, i=0 straat
const PLOTS=[{i:4,j:1},{i:5,j:1},{i:6,j:1},{i:7,j:2},{i:6,j:3},{i:7,j:4},{i:1,j:4},{i:3,j:6,beach:true}];
const HOTEL={i:3,j:3,w:2};
const GOAL={cash:500000,rating:8.5,rooms:110};
const MIS=[
 {n:'Bouw je eerste nieuwe kamer',f:()=>[S.st.built,1],c:2000,xp:50},
 {n:'Bouw een faciliteit op de kaart',f:()=>[facCount(),1],c:3000,xp:80},
 {n:'Verwelkom 10 honden',f:()=>[S.st.dogs,10],c:2500,xp:80},
 {n:'Bereik 44 kamers',f:()=>[nRooms(),44],c:5000,xp:150},
 {n:'Serveer 60 ontbijten op één dag',f:()=>[S.st.bestBf,60],c:4000,xp:120},
 {n:'Haal 90% bezetting op één nacht',f:()=>[Math.round(S.st.bestOcc*100),90],c:6000,xp:150,u:'%'},
 {n:'Haal een reviewscore van 8,0',f:()=>[+rating().toFixed(1),8],c:8000,xp:200},
 {n:'Bereik 66 kamers',f:()=>[nRooms(),66],c:10000,xp:250},
 {n:'Dagresultaat van €5.000',f:()=>[Math.round(S.st.bestRes),5000],c:10000,xp:250,u:'€'},
 {n:'Bouw 4 faciliteiten',f:()=>[facCount(),4],c:12000,xp:300},
 {n:'Bereik 88 kamers',f:()=>[nRooms(),88],c:15000,xp:350},
 {n:'Serveer 150 ontbijten op één dag',f:()=>[S.st.bestBf,150],c:12000,xp:300},
 {n:'Bereik 110 kamers',f:()=>[nRooms(),110],c:30000,xp:600},
 {n:'Haal een reviewscore van 8,5',f:()=>[+rating().toFixed(1),8.5],c:20000,xp:500},
];

let acc=0, S=null, modalOpen=false, modalQ=[], curTab='kaart', walkers=[], liftY=null;

// ================= helpers on state =================
function dateOf(day){return new Date(2026,3,1+day)}
function refPrice(t){const d=dateOf(S.day);const we=d.getDay()===5||d.getDay()===6;return RT[t].ref*PM[d.getMonth()]*(we?1.12:1)}
function rating(){const r=S.reviews;return r.length?r.reduce((a,b)=>a+b,0)/r.length:7.5}
function supF(p,ref){return clamp(Math.pow(ref/Math.max(p,1),1.5),.15,1.7)}
const G=id=>S.guests.find(g=>g.id===id);
const ACTIVE=['exp','lobby','q','ci','wait'];
const live=()=>S.rooms.filter(r=>r.st!=='build');
const nRooms=()=>live().length;
const facCount=()=>Object.keys(S.fac).length;
const hasFac=id=>Object.values(S.fac).some(f=>f.id===id);
const roomAt=(f,s)=>S.rooms.find(r=>r.f===f&&r.s===s);
function earn(cat,a){S.cash+=a;S.td.rev[cat]=(S.td.rev[cat]||0)+a}
function spend(cat,a){S.cash-=a;S.td.cost[cat]=(S.td.cost[cat]||0)+a}
function level(){let l=1;for(let i=1;i<LEVELS.length;i++)if(S.xp>=LEVELS[i])l=i+1;return l}
function addXP(n){
  const before=level();S.xp+=n;const after=level();
  if(after>before){
    const unl=[];
    if(maxFloors(after)>maxFloors(before))unl.push(`🏗️ bouwen tot ${maxFloors(after)} verdiepingen`);
    Object.values(FAC).filter(f=>f.lv===after).forEach(f=>unl.push(f.e+' '+f.n));
    UPG.filter(u=>u.lv===after).forEach(u=>unl.push(u.n));
    openModal({title:`⭐ Level ${after}!`,body:`<p>Je hotel groeit! Nieuw ontgrendeld:</p><p>${unl.join('<br>')||'—'}</p>`,buttons:[{t:'Top! 🎉'}]});
  }
}

// ================= new game =================
function makeRoom(f,s,type,dog,st){
  const r={id:S.rooms.length,nr:f*100+s+1,f,s,type,st:st||'clean',g:null,dog:!!dog,prio:false,svc:false,svcBy:false,wasDog:false,ready:0};
  S.rooms.push(r);return r;
}
function newGame(){
  S={v:2,day:0,min:0,cash:40000,xp:0,floors:3,rooms:[],guests:[],nid:1,fac:{},
    price:{double:120,twin:115,family:175},sup:{bed:25,dog:20,bf:18,late:20,early:15},
    pol:{late:true,early:true,over:false},staff:{rec:1,hk:3,bf:2},
    beds:6,up:{},reviews:Array.from({length:40},()=>+rnd(7,8.6).toFixed(1)),
    hist:[],q:[],rec:[],hk:[],bf:{seat:[],q:[]},bfLog:[],ev:[],td:null,wx:'⛅',wxF:1,speed:1,over:false,won:false,
    st:{built:0,dogs:0,bestBf:0,bestOcc:0,bestRes:-1e9},claimed:[]};
  const lay=['double','double','double','double','twin','twin','twin','twin','family','family','family'];
  for(let f=1;f<=3;f++)for(let s=0;s<SLOTS;s++)makeRoom(f,s,lay[s],f===1&&(s===0||s===4||s===8||s===9));
  for(const r of S.rooms){ if(R()<.55){ const g=makeGuest(r.type); g.nl=ri(0,3); g.nights=g.nl+1; if(g.dog&&!r.dog){g.dog=false;g.dogRate=0} g.st='in'; g.room=r.id; r.g=g.id; r.st='occ'; S.guests.push(g);} }
  startDay();
  S.min=420;
}
function makeGuest(type){
  const fam=type==='family';
  const persons=fam?(R()<.6?4:3):2;
  const bed=!fam&&R()<.18*supF(S.sup.bed,25);
  const dog=R()<.13*supF(S.sup.dog,20)*(hasFac('weide')?1.5:1);
  const bfIncl=R()<.6*supF(S.sup.bf,18);
  const nights=pickW([1,2,3,4,5],[.3,.35,.2,.1,.05]);
  const ref=refPrice(type), rate=S.price[type];
  let sat=rnd(70,86)+(S.up.reno||0)*5+(hasFac('well')?5:0)+(fam&&hasFac('speeltuin')?4:0)+(dog&&hasFac('weide')?4:0);
  sat-=Math.max(0,rate/ref-1)*40; sat+=Math.max(0,1-rate/ref)*15;
  return {id:S.nid++,name:'Fam. '+pick(NAMES),type,persons:persons+(bed?1:0),bed,dog,bfIncl,nights,nl:nights,rate,
    bedRate:bed?S.sup.bed:0,dogRate:dog?S.sup.dog:0,bfRate:S.sup.bf,st:'exp',sat,arr:0,room:null,co:0,
    bfT:-1,bfDone:false,inBf:false,bfQ:false,bqs:0,qs:0,ws:0,warned:false,spot:false,col:pick(['#e76f51','#2a9d8f','#264653','#8e5bd6','#d64570','#3a86ff','#6a994e','#bc6c25'])};
}
function arrTime(){ if(R()<.2) return ri(660,895); return Math.round(CHECKIN+Math.pow(R(),1.7)*390); }
function bfTime(wd){
  if(S.up.slots) return ri(BF_OPEN,630);
  const mean=(wd===0||wd===6)?570:540;
  return Math.round(clamp(mean+(R()+R()+R()-1.5)*75,BF_OPEN,640));
}

// ================= day start =================
function startDay(){
  const d=dateOf(S.day), m=d.getMonth(), wd=d.getDay();
  for(const r of S.rooms) if(r.st==='build'&&r.ready<=S.day){r.st='clean';}
  S.td={rev:{},cost:{},arr:0,arrPlanned:0,dep:0,bfServed:0,bfSpot:0,bfLost:0,bfMissed:0,bfPeak:0,lostFull:0,lostDog:0,walked:0,noshow:0,early:0,late:0,otMin:0,qPeak:0,walkins:0,revs:[]};
  S.bfLog=[];S.q=[];S.bf={seat:[],q:[]};S.rec=[];S.hk=[];
  const r=R();
  if(r<.2){S.wx='☀️';S.wxF=1.12}else if(r<.32){S.wx='🌧️';S.wxF=.85}else if(r<.38){S.wx='💨';S.wxF=.9}else{S.wx='⛅';S.wxF=1}
  const inh=S.guests.filter(g=>g.st==='in');
  const spotP=clamp(.45*Math.pow(18/Math.max(S.sup.bf,1),1.6),.05,.9);
  for(const g of inh){
    g.bfDone=false;g.inBf=false;g.bfQ=false;g.spot=!g.bfIncl;
    g.bfT=(g.bfIncl||R()<spotP)?bfTime(wd):-1;
    if(g.nl===0){
      let co=480+Math.pow(R(),.6)*235;
      if(R()<.22){ if(S.pol.late){co=ri(780,840);earn('fee',S.sup.late);S.td.late++;g.sat+=3;} else g.sat-=3; }
      if(g.bfT>=0) co=Math.max(co,g.bfT+55);
      g.co=Math.round(co);
    }
  }
  for(const rm of S.rooms){rm.svc=false;rm.svcBy=false;}
  for(const g of inh) if(g.nl>0&&g.room!=null) S.rooms[g.room].svc=true;
  const occ=clamp(OCC[m]+({5:.2,6:.25,0:-.12}[wd]||0),.05,1.1);
  const ratingF=clamp(.55+(rating()-5)*.12,.35,1.2);
  const mk=(S.up.mkt?1.1:1)*(hasFac('well')?1.05:1)*(hasFac('parking')?1.08:1)*S.wxF;
  let bedsFree=S.beds-inh.filter(g=>g.nl>0&&g.bed).length;
  for(const t of TYPES){
    const total=live().filter(x=>x.type===t).length;
    if(!total)continue;
    const stay=inh.filter(g=>g.type===t&&g.nl>0).length;
    const pf=clamp(Math.pow(refPrice(t)/S.price[t],1.8),.1,1.8);
    const want=Math.round(total*occ*pf*ratingF*mk*(t==='family'&&hasFac('speeltuin')?1.15:1)*rnd(.9,1.1));
    let n=Math.max(0,want-stay); const cap=total-stay;
    if(n>cap){S.td.lostFull+=n-cap;n=cap;}
    let dogFree=live().filter(x=>x.type===t&&x.dog&&(x.g==null||(G(x.g)&&G(x.g).nl===0))).length;
    for(let i=0;i<n;i++){
      const g=makeGuest(t);
      if(g.dog){ if(dogFree>0)dogFree--; else {S.td.lostDog++;continue;} }
      if(g.bed){ if(bedsFree>0)bedsFree--; else {g.bed=false;g.persons--;g.bedRate=0;g.sat-=5;} }
      g.arr=arrTime(); S.guests.push(g); S.td.arrPlanned++;
    }
  }
  S.ev=[];
  const nw=ri(0,2); for(let i=0;i<nw;i++) S.ev.push({t:ri(930,1260),type:'walk',done:false});
  if(R()<.6) S.ev.push({t:ri(600,1320),type:'klacht',done:false});
}

// ================= rooms & guests =================
function findRoom(g){
  const c=S.rooms.filter(r=>r.type===g.type&&r.st==='clean'&&r.g==null);
  if(!c.length) return null;
  return g.dog?(c.find(r=>r.dog)||c[0]):(c.find(r=>!r.dog)||c[0]);
}
function checkIn(g,r,fromDesk){
  r.g=g.id;r.st='occ';r.svc=false;g.room=r.id;g.st='in';S.td.arr++;
  if(g.dog)S.st.dogs++;
  walk(fromDesk?'desk':'lobby',{room:r},g.col,g.dog);
}
function checkOut(g){
  const r=S.rooms[g.room];
  r.g=null;r.st='dirty';r.wasDog=g.dog;r.svc=false;
  g.st='gone';S.td.dep++;
  review(g.sat);addXP(3);
  walk({room:r},'door',g.col,g.dog);
}
function review(sat){const sc=+clamp(sat/10,1,10).toFixed(1);S.reviews.push(sc);if(S.reviews.length>60)S.reviews.shift();S.td.revs.push(sc);if(sc>=9)S.xp+=3;}
function availTonight(t){
  const total=live().filter(x=>x.type===t).length;
  const used=S.guests.filter(g=>g.type===t&&(ACTIVE.includes(g.st)||(g.st==='in'&&g.nl>0))).length;
  return total-used;
}

// ================= simulation: one minute =================
function step(){
  const m=S.min, td=S.td;
  for(const e of S.ev) if(!e.done&&e.t<=m){e.done=true;fireEvent(e);}
  for(const g of S.guests){
    if(g.st==='exp'&&g.arr<=m){ if(m<CHECKIN)g.st='lobby'; else{g.st='q';g.qs=m;S.q.push(g.id);} }
    if(g.st==='lobby'){
      if(m>=CHECKIN){g.st='q';g.qs=m;S.q.push(g.id);}
      else if(S.pol.early){const r=findRoom(g);if(r){checkIn(g,r);earn('fee',S.sup.early);td.early++;g.sat+=3;}}
    }
  }
  for(const g of S.guests){
    if(g.st==='wait'){
      const r=findRoom(g);
      if(r) checkIn(g,r);
      else{g.sat-=.4;if(!g.warned&&m-g.ws>=45){g.warned=true;toast(`😤 ${g.name} wacht al 45 min op een ${RT[g.type].n}-kamer`);}}
    }else if(g.st==='q'&&m-g.qs>5) g.sat-=.3;
  }
  const ct=S.up.kiosk?1.5:3;
  while(S.rec.length<S.staff.rec)S.rec.push({g:null,l:0});
  for(let i=0;i<S.rec.length;i++){
    const s=S.rec[i];
    if(s.g!=null){s.l--;if(s.l<=0){const g=G(s.g);s.g=null;if(g){const r=findRoom(g);if(r)checkIn(g,r,true);else{g.st='wait';g.ws=m;}}}}
    if(s.g==null&&i<S.staff.rec&&S.q.length){const g=G(S.q.shift());if(g){g.st='ci';s.g=g.id;s.l=ct;}}
  }
  S.rec=S.rec.filter((s,i)=>i<S.staff.rec||s.g!=null);
  td.qPeak=Math.max(td.qPeak,S.q.length);
  for(const g of S.guests) if(g.st==='in'&&g.nl===0&&g.co<=m&&!g.inBf&&!g.bfQ) checkOut(g);
  // ontbijt
  const bf=S.bf;
  if(m>=BF_OPEN&&m<BF_CLOSE){
    for(const g of S.guests) if(g.st==='in'&&g.bfT>=0&&!g.bfDone&&!g.inBf&&!g.bfQ&&g.bfT<=m){g.bfQ=true;g.bqs=m;bf.q.push(g.id);walk({room:S.rooms[g.room]},'bf',g.col,false);}
  }
  bf.seat=bf.seat.filter(s=>{if(s.e<=m){const g=G(s.g);if(g){g.inBf=false;g.bfDone=true;}return false;}return true;});
  let used=bf.seat.reduce((a,s)=>a+s.p,0);
  if(m>=BF_OPEN&&m<BF_CLOSE){
    const rest=[];
    for(const id of bf.q){
      const g=G(id); if(!g)continue;
      if(used+g.persons<=SEATS){
        g.bfQ=false;g.inBf=true;
        let dur=rnd(28,45)*(S.up.coffee?.8:1); if(used>S.staff.bf*15)dur*=1.3;
        bf.seat.push({g:g.id,p:g.persons,e:m+dur,c:g.col});used+=g.persons;td.bfServed+=g.persons;
        if(g.spot){earn('bfSpot',g.persons*S.sup.bf);td.bfSpot+=g.persons;}
        const w=m-g.bqs; if(w>8)g.sat-=(w-8)*.4; else g.sat+=1;
      }else if(g.spot&&m-g.bqs>20){g.bfQ=false;g.bfDone=true;g.sat-=4;td.bfLost+=g.persons;}
      else rest.push(id);
    }
    bf.q=rest;
    for(const id of bf.q){const g=G(id);if(g)g.sat-=.15;}
  }
  if(m===BF_CLOSE&&bf.q.length){
    for(const id of bf.q){const g=G(id);if(!g)continue;g.bfQ=false;g.bfDone=true;
      if(g.spot){td.bfLost+=g.persons;g.sat-=4;}else{td.bfMissed+=g.persons;g.sat-=15;}}
    toast('🍳 Ontbijtzaal dicht om 11u – er stonden nog gasten aan te schuiven!');
    bf.q=[];
  }
  if(used>S.staff.bf*15) for(const s of bf.seat){const g=G(s.g);if(g)g.sat-=.15;}
  td.bfPeak=Math.max(td.bfPeak,used);
  if(m>=BF_OPEN&&m<=690&&m%5===0) S.bfLog.push(used);
  // poetsdienst
  const ot=S.pol.over&&m>=HK_END&&m<HK_OT_END;
  const work=m>=HK_START&&(m<HK_END||ot);
  while(S.hk.length<S.staff.hk)S.hk.push({r:null,l:0,svc:false});
  for(let i=0;i<S.hk.length;i++){
    const h=S.hk[i];
    if(h.r!=null){
      h.l--; if(m>=HK_END)td.otMin++;
      if(h.l<=0){const r=S.rooms[h.r];if(h.svc){r.svc=false;r.svcBy=false;}else{r.st='clean';r.prio=false;}h.r=null;}
    }
    if(h.r==null&&i<S.staff.hk&&work){const j=pickJob(m);if(j){h.r=j.r;h.l=j.l;h.svc=j.svc;}}
  }
  S.hk=S.hk.filter((h,i)=>i<S.staff.hk||h.r!=null);
}
function pickJob(m){
  const need={double:0,twin:0,family:0};
  for(const g of S.guests) if(ACTIVE.includes(g.st)) need[g.type]++;
  for(const r of S.rooms) if(r.st==='clean'&&r.g==null) need[r.type]--;
  const dirty=S.rooms.filter(r=>r.st==='dirty');
  if(dirty.length){
    dirty.sort((a,b)=>(b.prio-a.prio)||(need[b.type]-need[a.type])||(a.nr-b.nr));
    const r=dirty[0];r.st='cleaning';
    return {r:r.id,l:RT[r.type].cl+(r.wasDog?15:0),svc:false};
  }
  if(m<HK_END){
    const s=S.rooms.find(r=>r.svc&&!r.svcBy&&r.st==='occ'&&r.g!=null&&!(G(r.g)||{}).inBf);
    if(s){s.svcBy=true;return {r:s.id,l:15,svc:true};}
  }
  return null;
}

// ================= events =================
function fireEvent(e){
  const m=S.min;
  if(e.type==='walk'){
    const opts=TYPES.filter(t=>availTonight(t)>0);
    if(!opts.length)return;
    const t=pick(opts), p=S.price[t], hi=Math.round(p*1.25/5)*5, n=ri(1,2);
    const mk=rate=>{const g=makeGuest(t);g.rate=rate;g.nights=n;g.nl=n;g.dog=false;g.dogRate=0;g.arr=m;g.st='q';g.qs=m;S.guests.push(g);S.q.push(g.id);S.td.arrPlanned++;S.td.walkins++;};
    openModal({title:'🚶 Walk-in aan de balie',body:`<p>Een gezelschap komt binnen zonder reservatie en vraagt een <b>${RT[t].n}</b>-kamer voor <b>${n} nacht${n>1?'en':''}</b>.</p><p>Je hebt vannacht nog <b>${availTonight(t)}</b> ${RT[t].n}-kamer(s) vrij.</p>`,
      buttons:[
        {t:`Standaardprijs ${eur(p)} / nacht`,fn:()=>{mk(p);toast('✅ Walk-in geboekt');}},
        {t:`Last-minute prijs ${eur(hi)} / nacht`,fn:()=>{if(R()<.55){mk(hi);toast('💰 Ze gaan akkoord met de hogere prijs!');}else toast('🙅 Te duur – ze lopen door naar de buren.');}},
        {t:'Weigeren',cls:'sec'}
      ]});
  }else if(e.type==='klacht'){
    const inh=S.guests.filter(g=>g.st==='in'&&g.room!=null);
    if(!inh.length)return;
    const g=pick(inh), r=S.rooms[g.room];
    const why=pick(['lawaai van de buren','een lauwe douche','een doorgezakt kussen','een haar in de badkamer','een hond die blaft op de gang','de wifi die hapert','meeuwen op het balkon']);
    const disc=Math.round(g.rate*.2);
    openModal({title:'😠 Klacht van kamer '+r.nr,body:`<p>${g.name} klaagt over <b>${why}</b>.</p>`,
      buttons:[
        {t:'Gratis drankje aan de bar (€8)',fn:()=>{spend('gebaar',8);g.sat+=8;toast('🍹 Drankje aangeboden');}},
        {t:`20% korting op de kamer (−${eur(disc)})`,fn:()=>{spend('gebaar',disc);g.sat+=18;toast('💶 Korting gegeven – gast is tevreden');}},
        {t:'Enkel excuses aanbieden',cls:'sec',fn:()=>{g.sat+=1;}}
      ]});
  }
}

// ================= night audit =================
function facIncome(id,persons,occ,m){
  const sunny=S.wx==='☀️'?1.4:S.wx==='⛅'?1:.4, summer=m>=5&&m<=7;
  switch(id){
    case 'parking':return occ*6;
    case 'fiets':return persons*2.5*sunny;
    case 'terras':return persons*.3*15*sunny*(summer?1.4:.6);
    case 'well':return persons*.15*12;
    case 'strandbar':return (summer?800:m===4||m===8?400:120)*sunny;
    default:return 0;
  }
}
function audit(){
  const td=S.td;
  for(const g of S.guests){
    if(['q','ci','wait','lobby'].includes(g.st)){g.st='gone';td.walked++;spend('doorverwijzing',150);review(20);}
    else if(g.st==='exp'){g.st='gone';td.noshow++;earn('noshow',g.rate);}
  }
  let occ=0,roomRev=0,persons=0;
  for(const g of S.guests) if(g.st==='in'){
    occ++;persons+=g.persons;roomRev+=g.rate;earn('room',g.rate);
    if(g.bed)earn('bed',g.bedRate);
    if(g.dog)earn('dog',g.dogRate);
    if(g.bfIncl)earn('bf',g.bfRate*g.persons);
    if(g.room!=null&&S.rooms[g.room].svc)g.sat-=6;
    g.nl--;
  }
  const nR=nRooms();
  spend('lonen',S.staff.rec*WAGE.rec+S.staff.hk*WAGE.hk+S.staff.bf*WAGE.bf);
  if(td.otMin)spend('overuren',td.otMin*OT_MIN);
  spend('vaste kosten',fixedCost());
  spend('linnen & was',occ*LAUNDRY);
  spend('energie & onderhoud',occ*15);
  spend('ontbijt food',td.bfServed*BFCOST);
  spend('commissie boekingssites',roomRev*COMM);
  const d=dateOf(S.day);
  for(const f of Object.values(S.fac)){const inc=facIncome(f.id,persons,occ,d.getMonth());f.pend=Math.min((f.pend||0)+inc,Math.max(inc,1)*3);}
  const rev=Object.values(td.rev).reduce((a,b)=>a+b,0), cost=Object.values(td.cost).reduce((a,b)=>a+b,0);
  const h={day:S.day,ds:`${DAG[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`,m:d.getMonth(),n:nR,occ:nR?occ/nR:0,rooms:occ,adr:occ?roomRev/occ:0,revpar:nR?roomRev/nR:0,rev,cost,res:rev-cost,rating:rating(),
    dayRev:td.revs.length?td.revs.reduce((a,b)=>a+b,0)/td.revs.length:null,bfPeak:td.bfPeak,bfServed:td.bfServed,bfMissed:td.bfMissed,bfLost:td.bfLost,lostFull:td.lostFull,lostDog:td.lostDog,walked:td.walked,noshow:td.noshow,qPeak:td.qPeak,revB:{...td.rev},costB:{...td.cost},wx:S.wx};
  S.hist.push(h); if(S.hist.length>120)S.hist.shift();
  S.st.bestBf=Math.max(S.st.bestBf,td.bfServed);S.st.bestOcc=Math.max(S.st.bestOcc,h.occ);S.st.bestRes=Math.max(S.st.bestRes,h.res);
  S.guests=S.guests.filter(g=>g.st==='in');
  S.day++;S.min=0;
  startDay();
  save();
  showReport(h);
  if(S.cash<-30000){S.over=true;openModal({title:'📉 Ontslagen…',body:'<p>De eigenaar heeft je ontslagen: de kaspositie zakte onder −€30.000.</p><p>Tip: pas je personeel aan op het seizoen en bouw niet te snel.</p>',buttons:[{t:'Opnieuw beginnen',fn:()=>{newGame();save();renderAll();}}]});}
  else if(!S.won&&S.cash>=GOAL.cash&&rating()>=GOAL.rating&&nRooms()>=GOAL.rooms){S.won=true;openModal({title:'🏆 Doel gehaald!',body:`<p>Proficiat! 110 kamers, ${eur(GOAL.cash)} in kas én een reviewscore van ${GOAL.rating}+. De eigenaar geeft je een bonus en een vast contract.</p><p>Je kan gewoon verder spelen.</p>`,buttons:[{t:'Verder spelen'}]});}
}
const LBL={room:'Kamers',bf:'Ontbijt (in reservatie)',bfSpot:'Ontbijt (ter plaatse)',bed:'Bijzetbedden',dog:'Honden',fee:'Late check-out / vroege check-in',noshow:'No-show',fac:'Faciliteiten',missie:'Missiebeloningen'};
function showReport(h){
  const rb=Object.entries(h.revB).filter(e=>e[1]).map(([k,v])=>`<div class="kv"><span>${LBL[k]||k}</span><b>${eur(v)}</b></div>`).join('');
  const cb=Object.entries(h.costB).filter(e=>e[1]).map(([k,v])=>`<div class="kv"><span>${k}</span><b>−${eur(v)}</b></div>`).join('');
  const notes=[];
  if(h.walked)notes.push(`🚕 ${h.walked} gast(en) doorverwezen naar een ander hotel (geen kamer klaar)`);
  if(h.bfMissed)notes.push(`🍳 ${h.bfMissed} personen misten hun inbegrepen ontbijt`);
  if(h.bfLost)notes.push(`🍳 ${h.bfLost} ontbijtklanten haakten af door de wachtrij`);
  if(h.lostFull)notes.push(`📵 ${h.lostFull} boekingsaanvragen geweigerd: volzet → bijbouwen?`);
  if(h.lostDog)notes.push(`🐾 ${h.lostDog} gasten met hond vonden geen hondenkamer`);
  if(h.noshow)notes.push(`👻 ${h.noshow} no-show(s) – 1e nacht aangerekend`);
  const nd=dateOf(S.day);
  openModal({title:`🌙 Nachtaudit – ${h.ds}`,body:`
    <div class="kpis">
      <div class="kpi"><span>Bezetting</span><b>${pct(h.occ)}</b></div>
      <div class="kpi"><span>ADR</span><b>${eur(h.adr)}</b></div>
      <div class="kpi"><span>RevPAR</span><b>${eur(h.revpar)}</b></div>
      <div class="kpi"><span>Omzet</span><b>${eur(h.rev)}</b></div>
      <div class="kpi"><span>Kosten</span><b>${eur(h.cost)}</b></div>
      <div class="kpi"><span>Resultaat</span><b class="${h.res>=0?'pos':'neg'}">${eur(h.res)}</b></div>
    </div>
    <div class="kv"><span>Kamers in gebruik</span><b>${h.rooms} / ${h.n}</b></div>
    <div class="kv"><span>Reviews vandaag</span><b>${h.dayRev!=null?h.dayRev.toFixed(1):'–'}</b></div>
    <div class="kv"><span>Ontbijt: geserveerd / piek</span><b>${h.bfServed} / ${h.bfPeak} van 50</b></div>
    ${notes.length?'<p style="font-size:13px">'+notes.join('<br>')+'</p>':'<p style="font-size:13px">✨ Een vlotte dag zonder problemen!</p>'}
    ${Object.values(S.fac).some(f=>f.pend>=1)?'<p style="font-size:13px">💰 Je faciliteiten hebben geld opgebracht – tik op de muntjes op de kaart!</p>':''}
    <details><summary style="font-size:13px;margin-top:6px">Detail omzet &amp; kosten</summary>${rb}<hr>${cb}</details>`,
    buttons:[{t:`Start ${DAG[nd.getDay()]} ${nd.getDate()} ${MAAND[nd.getMonth()]} ☀️`}]});
}

// ================= modal & toast =================
function openModal(o){modalQ.push(o);if(!modalOpen)nextModal();}
function nextModal(){
  const o=modalQ.shift(); if(!o){modalOpen=false;$('#modal').classList.remove('on');return;}
  modalOpen=true;
  $('#mbox').innerHTML=`<h2>${o.title}</h2>${o.body||''}<div class="acts">${o.buttons.map((b,i)=>`<button class="btn ${b.cls||''}" data-i="${i}" ${b.dis?'disabled':''}>${b.t}</button>`).join('')}</div>`;
  $('#mbox').querySelectorAll('.acts button').forEach(el=>el.onclick=()=>{
    const chk={};$('#mbox').querySelectorAll('input[type=checkbox]').forEach(c=>chk[c.id]=c.checked);
    const b=o.buttons[+el.dataset.i];nextModal();b.fn&&b.fn(chk);renderAll();});
  $('#modal').classList.add('on');
}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),3600);while($('#toasts').children.length>3)$('#toasts').firstChild.remove();}

// ================= building =================
function buildRoomModal(f,s){
  const empty=[];for(let x=0;x<SLOTS;x++)if(!roomAt(f,x))empty.push(x);
  const b=t=>({t:`${RT[t].n} – ${eur(RT[t].cost)}`,fn:c=>buildRooms(f,c.all?empty:[s],t,c.dog)});
  openModal({title:`🏗️ Bouwen op verdieping ${f}`,body:`<p>Kies het kamertype voor plaats ${f*100+s+1}. De kamer is klaar vanaf <b>morgen</b>.</p>
    <p style="font-size:13px;color:var(--mut)">Double: 2 pers. · Twin: 2 aparte bedden · Familie: 4 pers. Double/Twin kunnen een bijzetbed krijgen.</p>
    <label><input type="checkbox" id="dog"> 🐾 Hondvriendelijk inrichten (+${eur(DOGCOST)} per kamer)</label>
    ${empty.length>1?`<label><input type="checkbox" id="all"> Hele verdieping vullen (${empty.length} kamers, prijs × ${empty.length})</label>`:''}`,
    buttons:[b('double'),b('twin'),b('family'),{t:'Annuleren',cls:'sec'}]});
}
function buildRooms(f,slots,t,dog){
  const cost=slots.length*(RT[t].cost+(dog?DOGCOST:0));
  if(S.cash<cost){toast(`💸 Niet genoeg geld: je hebt ${eur(cost)} nodig`);return;}

// ================= walkers (doorsnede) =================
function walk(from,to,col,dog){
  if(curTab!=='hotel'||!S.speed||walkers.length>30||!XL)return;
  const p=wpath(from,to); if(!p)return;
  let len=0;for(let i=1;i<p.length;i++)len+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);
  walkers.push({p,len,t0:performance.now(),dur:Math.max(1500,len/90*1000),col,dog});
}
function wpath(from,to){
  const L=XL, gf=L.gY+L.GH-6, lx=L.x0+L.LW/2;
  const pt=w=>{
    if(w==='desk')return[{x:L.deskX-6,y:gf}];
    if(w==='lobby')return[{x:L.xr+30,y:gf}];
    if(w==='door')return[{x:L.xr+6,y:gf}];
    if(w==='bf')return[{x:L.bx0+10,y:gf}];
    const r=w.room;if(!r||r.f>S.floors)return null;
    const fy=L.floorY(r.f)+L.FH-4;
    return[{x:L.xr+r.s*L.sw+L.sw/2,y:fy},{x:lx,y:fy}];
  };
  const a=pt(from),b=pt(to);if(!a||!b)return null;
  const aR=typeof from==='object', bR=typeof to==='object';
  let path=[];
  if(aR){path=[a[0],a[1],{x:lx,y:gf}];}else path=[a[0],{x:lx,y:gf}];
  if(bR){path.push(b[1],b[0]);}else path.push(b[0]);
  if(!aR&&!bR)path=[a[0],b[0]];
  return path;
}
function walkerPos(w,now){
  let d=clamp((now-w.t0)/w.dur,0,1)*w.len;
  for(let i=1;i<w.p.length;i++){const a=w.p[i-1],b=w.p[i],l=Math.hypot(b.x-a.x,b.y-a.y);if(d<=l||i===w.p.length-1){const t=l?clamp(d/l,0,1):1;return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,inLift:Math.abs(a.x-b.x)<1&&Math.abs(a.y-b.y)>1};}d-=l;}
  return w.p[w.p.length-1];
}

function diamond(c,i,j,col,stroke){
  const a=iso(i,j),b=iso(i+1,j),d=iso(i+1,j+1),e=iso(i,j+1);
  c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.lineTo(d.x,d.y);c.lineTo(e.x,e.y);c.closePath();c.fillStyle=col;c.fill();
  if(stroke){c.strokeStyle=stroke;c.lineWidth=1;c.stroke();}
}
function isoBox(c,i,j,wi,wj,h,top,left,right){
  const A=iso(i,j),B=iso(i+wi,j),C=iso(i+wi,j+wj),D=iso(i,j+wj);
  c.fillStyle=left;c.beginPath();c.moveTo(D.x,D.y);c.lineTo(C.x,C.y);c.lineTo(C.x,C.y-h);c.lineTo(D.x,D.y-h);c.closePath();c.fill();
  c.fillStyle=right;c.beginPath();c.moveTo(B.x,B.y);c.lineTo(C.x,C.y);c.lineTo(C.x,C.y-h);c.lineTo(B.x,B.y-h);c.closePath();c.fill();
  c.fillStyle=top;c.beginPath();c.moveTo(A.x,A.y-h);c.lineTo(B.x,B.y-h);c.lineTo(C.x,C.y-h);c.lineTo(D.x,D.y-h);c.closePath();c.fill();
  return{A,B,C,D};
}

  // auto op de straat

function drawIsoHotel(c,night){
  const F=S.floors, h=18+F*13;
  const {A,B,C,D}=isoBox(c,HOTEL.i,HOTEL.j,HOTEL.w,HOTEL.w,h,'#5a7d8c','#efe6d4','#d9cdb5');
  // ramen per verdieping
  for(let f=1;f<=F;f++){
    const rooms=S.rooms.filter(r=>r.f===f);
    const occ=rooms.filter(r=>r.st==='occ').length;
    for(let k=0;k<6;k++){
      const built=rooms.length>k*SLOTS/6;
      const lit=occ>k*SLOTS/6;
      const col=!built?'#c9bfa8':night?(lit?'#ffd166':'#4a5560'):(lit?'#ffe9a8':'#9fd0e4');
      for(const face of [[D,C],[B,C]]){
        const t=(k+.25)/6, t2=(k+.75)/6;
        const p1={x:face[0].x+(face[1].x-face[0].x)*t,y:face[0].y+(face[1].y-face[0].y)*t};
        const p2={x:face[0].x+(face[1].x-face[0].x)*t2,y:face[0].y+(face[1].y-face[0].y)*t2};
        const y0=-(14+f*13)+3;
        c.fillStyle=col;c.beginPath();c.moveTo(p1.x,p1.y+y0);c.lineTo(p2.x,p2.y+y0);c.lineTo(p2.x,p2.y+y0+7);c.lineTo(p1.x,p1.y+y0+7);c.closePath();c.fill();
      }
    }
  }
  // inkom gelijkvloers
  const mid={x:(D.x+C.x)/2,y:(D.y+C.y)/2};c.fillStyle='#1d6f8a';c.fillRect(mid.x-6,mid.y-12,12,10);
  // naambord
  c.fillStyle='#fff';c.font='bold 9px system-ui';c.textAlign='center';c.fillText('DUINZICHT',(A.x+C.x)/2,(A.y+C.y)/2-h);
  // vlag
  c.strokeStyle='#555';c.beginPath();c.moveTo(A.x,A.y-h);c.lineTo(A.x,A.y-h-16);c.stroke();c.fillStyle='#e76f51';c.fillRect(A.x,A.y-h-16,9,6);
}
function drawPlot(c,idx,now,sh){
  const p=PLOTS[idx], f=S.fac[idx];
  if(!f){
    const a=iso(p.i+.5,p.j+.5);
    c.setLineDash([4,3]);diamond(c,p.i+.1,p.j+.1,'rgba(255,255,255,.18)',null);c.setLineDash([]);
    c.fillStyle='rgba(255,255,255,.85)';c.beginPath();c.arc(a.x,a.y,8,0,7);c.fill();c.fillStyle='#2a9d8f';c.font='bold 13px system-ui';c.textAlign='center';c.textBaseline='middle';c.fillText('+',a.x,a.y+.5);
    return;
  }
  const F=FAC[f.id];
  isoBox(c,p.i+.12,p.j+.12,.76,.76,F.h,sh(F.col),sh('#e8dcc4'),sh('#cfc2a6'));
  const a=iso(p.i+.5,p.j+.5);
  c.font='16px system-ui';c.textAlign='center';c.textBaseline='middle';c.fillText(F.e,a.x,a.y-F.h-4);
  if(f.pend>=1){
    const by=a.y-F.h-26+Math.sin(now/300+idx)*2.5;
    c.fillStyle='#f2b705';c.beginPath();c.arc(a.x,by,9,0,7);c.fill();c.strokeStyle='#a87b00';c.lineWidth=1.5;c.stroke();
    c.fillStyle='#3b2a00';c.font='bold 11px system-ui';c.fillText('€',a.x,by+.5);
  }
}
function mapTap(px,py){

  for(let idx=0;idx<PLOTS.length;idx++){const f=S.fac[idx];if(f&&f.pend>=1){const p=PLOTS[idx],a=iso(p.i+.5,p.j+.5),by=a.y-FAC[f.id].h-26;if(Math.hypot(x-a.x,y-by)<16){collect(idx);renderAll();return;}}}

  const A=iso(HOTEL.i,HOTEL.j),B=iso(HOTEL.i+2,HOTEL.j),C=iso(HOTEL.i+2,HOTEL.j+2),D=iso(HOTEL.i,HOTEL.j+2),h=18+S.floors*13;
  if(x>=D.x&&x<=B.x&&y>=A.y-h&&y<=C.y){setTab('hotel');return;}

  const i=Math.floor((xi+yj)/2), j=Math.floor((yj-xi)/2);

// ================= loop =================
function tick(){
  if(!S||modalOpen||S.over||S.speed===0)return;
  const quiet=S.min<420||S.min>=1320;
  // ▶ ≈ 15 min per speeldag (7u–22u), ▶▶ ≈ 7,5 min, ⏩ ≈ 3 min
  acc+=quiet?12:({1:.1,2:.2,4:.5}[S.speed]||.1);
  const n=Math.floor(acc); acc-=n;
  for(let i=0;i<n;i++){
    S.min++;
    if(S.min>=1440){audit();break;}
    step();
    if(modalOpen)break;
  }
  if(n)renderLive();
}
let lastFrame=0;
function frame(now){
  requestAnimationFrame(frame);
  if(now-lastFrame<33)return;lastFrame=now;
  if(!S)return;
  if(curTab==='hotel')drawHotel(now);else if(curTab==='kaart')drawMap(now);
}

  const tb=$('#t-beheer');
  tb.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const [o,k]=b.dataset.a.split('.'),[st,mn,mx]=STEP[b.dataset.a];S[o][k]=clamp(S[o][k]+st*(+b.dataset.d),mn,mx);renderBeheer();save();});
  tb.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.pol[b.dataset.p]=!S.pol[b.dataset.p];renderBeheer();save();});
  tb.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>buy(b.dataset.u));
  $('#help').onclick=intro;
  $('#reset').onclick=()=>openModal({title:'Nieuw spel?',body:'<p>Je huidige hotel gaat verloren.</p>',buttons:[{t:'Ja, opnieuw beginnen',cls:'red',fn:()=>{newGame();save();}},{t:'Annuleren',cls:'sec'}]});
}
function buy(id){
  const u=UPG.find(x=>x.id===id), l=S.up[id]||0;
  if(l>=u.max||S.cash<u.c||u.lv>level())return;
  S.cash-=u.c;S.up[id]=l+1;if(id==='beds')S.beds+=5;
  addXP(40);toast('✅ '+u.n.replace(/^\S+\s/,'')+' gekocht');save();renderAll();
}
function misDone(i){const [a,b]=MIS[i].f();return a>=b;}
function renderMis(){
  const lv=level(), a=LEVELS[lv-1], b=LEVELS[lv];
  const open=MIS.map((x,i)=>i).filter(i=>!S.claimed.includes(i)).slice(0,5);
  $('#t-mis').innerHTML=`
  <div class="card"><h3>⭐ Level ${lv} <small>${S.xp} XP${b?' · volgende: '+b:''}</small></h3>
    <div class="goal"><i style="width:${b?clamp((S.xp-a)/(b-a)*100,0,100):100}%;background:var(--gold)"></i></div>
    <p class="hint">XP verdien je met vertrekkende gasten, nieuwe kamers, faciliteiten en missies. Hogere levels ontgrendelen verdiepingen en faciliteiten.</p></div>
  <div class="card"><h3>🎯 Missies <small>${S.claimed.length}/${MIS.length} voltooid</small></h3>
    ${open.map(i=>{const x=MIS[i],[c,t]=x.f(),done=c>=t;const fmt=v=>x.u==='€'?eur(v):x.u==='%'?v+'%':v;
      return `<div class="mis"><div class="t"><b>${x.n}</b>${done?`<button class="btn gold" data-m="${i}">Claim</button>`:''}</div>
      <div class="goal"><i style="width:${clamp(c/t*100,0,100)}%"></i></div>
      <div class="rw">${fmt(Math.min(c,t))} / ${fmt(t)} · beloning ${eur(x.c)} + ${x.xp} XP</div></div>`}).join('')||'<p class="hint">Alle missies voltooid! 🏆</p>'}
  </div>`;
  $('#t-mis').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=+b.dataset.m;if(S.claimed.includes(i)||!misDone(i))return;S.claimed.push(i);earn('missie',MIS[i].c);addXP(MIS[i].xp);toast(`🎉 Missie voltooid: +${eur(MIS[i].c)}`);save();renderAll();});
}
function renderRap(){
  const H=S.hist;
  if(!H.length){$('#t-rap').innerHTML='<div class="card"><h3>📊 Rapport</h3><p class="hint">Na de eerste nachtaudit (middernacht) verschijnen hier je cijfers.</p></div>';return;}
  const last=H[H.length-1], cm=last.m, mon=H.filter(h=>h.m===cm&&h.day>S.day-32);
  const sum=k=>mon.reduce((a,h)=>a+h[k],0);
  const rooms=sum('rooms'), avail=sum('n'), roomRev=mon.reduce((a,h)=>a+(h.revB.room||0),0);
  const rows=H.slice(-14).reverse().map(h=>`<tr><td>${h.wx} ${h.ds}</td><td>${pct(h.occ)}</td><td>${eur(h.adr)}</td><td>${eur(h.rev)}</td><td class="${h.res>=0?'pos':'neg'}">${eur(h.res)}</td><td>${h.dayRev!=null?h.dayRev.toFixed(1):'–'}</td></tr>`).join('');
  $('#t-rap').innerHTML=`
  <div class="card"><h3>📅 ${MAAND[cm]} tot nu <small>${mon.length} dagen</small></h3>
    <div class="kpis">
      <div class="kpi"><span>Bezetting</span><b>${pct(avail?rooms/avail:0)}</b></div>
      <div class="kpi"><span>ADR</span><b>${eur(rooms?roomRev/rooms:0)}</b></div>
      <div class="kpi"><span>RevPAR</span><b>${eur(avail?roomRev/avail:0)}</b></div>
      <div class="kpi"><span>Omzet</span><b>${eur(sum('rev'))}</b></div>
      <div class="kpi"><span>Kosten</span><b>${eur(sum('cost'))}</b></div>
      <div class="kpi"><span>Resultaat</span><b class="${sum('res')>=0?'pos':'neg'}">${eur(sum('res'))}</b></div>
    </div>
    <div class="kv"><span>Doorverwezen gasten</span><b>${sum('walked')}</b></div>
    <div class="kv"><span>Gemist ontbijt (inbegrepen)</span><b>${sum('bfMissed')}</b></div>
    <div class="kv"><span>Geweigerd: volzet / geen hondenkamer</span><b>${sum('lostFull')} / ${sum('lostDog')}</b></div>
  </div>
  <div class="card"><h3>Laatste 14 dagen</h3>
    <table><tr><th>Dag</th><th>Bez.</th><th>ADR</th><th>Omzet</th><th>Result.</th><th>★</th></tr>${rows}</table>
    <button class="btn sec" style="margin-top:10px" id="lastrep">Laatste nachtaudit openen</button>
  </div>`;
  $('#lastrep').onclick=()=>showReport(last);
}
function renderLive(){renderTop();if(curTab==='hotel')renderChips();else if(curTab==='dag')renderDag();else if(curTab==='kaart')renderMapInfo();}
function renderAll(){renderTop();renderChips();renderMapInfo();renderDag();renderBeheer();renderMis();renderRap();}
function setTab(t){
  curTab=t;walkers=[];
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.id==='t-'+t));
  renderAll();window.scrollTo(0,0);
}
function intro(){
  openModal({title:'🏨 Welkom, General Manager!',body:`
  <p>Je start met <b>Hotel Duinzicht</b> aan de Belgische kust: 3 verdiepingen en 33 kamers. Bouw het uit tot <b>110 kamers</b> – Double, Twin en familiekamers voor 4.</p>
  <p>🗺️ Op de <b>kaart</b> bouw je faciliteiten (parking, speeltuin, hondenweide, strandbar…) en int je hun inkomsten. Tik op het hotel om binnen te kijken.</p>
  <p>🏨 In de <b>doorsnede</b> zie je gasten, poetsdienst en ontbijtzaal live. Tik op lege plekken om kamers te bouwen.</p>
  <p>🛏️ Bijzetbed en 🐕 hond kosten een meerprijs. 🍳 Ontbijt van 7:30 tot 11:00 in een zaal van <b>max. 50 plaatsen</b>. Check-out tot <b>12:00</b>, check-in vanaf <b>15:00</b>.</p>
  <p>🎯 Volg de <b>missies</b>, stijg in level en haal: 110 kamers, ${eur(GOAL.cash)} in kas en een reviewscore van ${GOAL.rating}.</p>`,
  buttons:[{t:"Let's go! 🌊"}]});
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.v===2)return o;}}catch(e){}return null;}

// ================= init =================
document.querySelectorAll('.speed button').forEach(b=>b.onclick=()=>{S.speed=+b.dataset.s;renderTop();});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
$('#cvHotel').addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect();hotelTap(e.clientX-r.left,e.clientY-r.top);});
$('#cvMap').addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect();mapTap(e.clientX-r.left,e.clientY-r.top);});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
S=load();
const fresh=!S;
if(fresh)newGame();
renderAll();
if(fresh)intro();
setInterval(tick,100);
requestAnimationFrame(frame);
</script>
</body>
</html>
